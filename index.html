<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phonics Fun: The /ph/ Sound</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Animations */
        @keyframes pulse-soft {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }

        @keyframes bounce-in {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); }
        }

        .animate-bounce-in { animation: bounce-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .shake-animation { animation: shake 0.4s ease-in-out; }
        
        .card-hover {
            transition: all 0.2s ease-in-out;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        /* Custom scrollbar for matching game */
        .custom-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 10px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #888; 
            border-radius: 10px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #555; 
        }
    </style>
</head>
<body class="text-gray-800 pb-12">

    <!-- Navigation Header -->
    <nav class="bg-white/80 backdrop-blur-md shadow-lg sticky top-0 z-50 p-4 border-b-4 border-pink-400">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-pink-500 flex items-center gap-2">
                <svg class="w-10 h-10 text-pink-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Phonics Fun!
            </div>
            <div class="flex flex-wrap justify-center gap-2" id="nav-buttons">
                <!-- Nav buttons injected via JS -->
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="max-w-6xl mx-auto mt-8 px-4" id="app-container">
        <!-- Content injected here by JS -->
    </main>

    <!-- Success Feedback Overlay -->
    <div id="celebration-overlay" class="fixed inset-0 pointer-events-none z-[100] flex items-center justify-center opacity-0 transition-opacity duration-300">
        <div class="bg-green-500 text-white font-black text-6xl px-12 py-8 rounded-full shadow-2xl transform scale-50 transition-transform duration-300" id="celebration-badge">
            ⭐ Excellent! ⭐
        </div>
    </div>

    <script>
        // --- DATA (From Short_PH_Words_For_Kids_2.docx) ---
        const wordsData = [
            // Words Starting with 'ph'
            { eng: "Photo", amh: "ፎቶ", pron: "Foto" },
            { eng: "Phone", amh: "ስልክ", pron: "Silk" },
            { eng: "Phase", amh: "ምዕራፍ / ደረጃ", pron: "Mi'iraf / Dereja" },
            { eng: "Phrase", amh: "ሐረግ", pron: "Hareg" },
            { eng: "Phonics", amh: "የድምፅ ትምህርት", pron: "Yedimts Timhirt" },
            // Words with 'ph' in the Middle
            { eng: "Elephant", amh: "ዝሆን", pron: "Zihon" },
            { eng: "Dolphin", amh: "ዶልፊን", pron: "Dolfin" },
            { eng: "Alphabet", amh: "ፊደል", pron: "Fidel" },
            { eng: "Trophy", amh: "ዋንጫ", pron: "Wanch'a" },
            { eng: "Orphan", amh: "ወላጅ አልባ", pron: "Welaj Alba" },
            { eng: "Nephew", amh: "የወንድም/የእህት ልጅ", pron: "Yewendim / Ye'ihit Lij" },
            { eng: "Gopher", amh: "መሬት ቆፋሪ እንስሳ", pron: "Meret Qofari Insisa" },
            // Words Ending with 'ph'
            { eng: "Graph", amh: "ግራፍ / ንድፍ", pron: "Graf / Nidif" },
            { eng: "Morph", amh: "መቀየር", pron: "Mek'eyer" },
            { eng: "Glyph", amh: "ቅርጽ", pron: "Qirts" },
            { eng: "Triumph", amh: "ድል", pron: "Dil" },
            { eng: "Paragraph", amh: "አንቀጽ", pron: "Ank'ets" }
        ];

        // Enrich data with image placeholders
        const words = wordsData.map(w => ({
            ...w,
            img: `https://placehold.co/400x300/FFB6C1/800080?text=${w.eng}` // Generates a colorful placeholder
        }));

        // --- AUDIO SYSTEM (Web Speech API) ---
        let voices = [];
        let preferredVoice = null;

        function loadVoices() {
            voices = window.speechSynthesis.getVoices();
            // Try to find a UK Female voice
            preferredVoice = voices.find(v => (v.lang === 'en-GB' && v.name.toLowerCase().includes('female'))) ||
                             voices.find(v => v.lang === 'en-GB') ||
                             voices.find(v => v.name.toLowerCase().includes('female')) ||
                             voices[0];
        }

        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices(); // Initial load

        function speak(text) {
            // Cancel any ongoing speech
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            if (preferredVoice) utterance.voice = preferredVoice;
            utterance.rate = 0.85; // Slightly slower for kids
            utterance.pitch = 1.2; // Slightly higher pitch
            window.speechSynthesis.speak(utterance);
        }

        // Play a simple beep/success sound using Web Audio API (fallback for instant feedback)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(frequency, type, duration) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
        }
        function playSuccessSound() {
            playTone(440, 'sine', 0.1);
            setTimeout(() => playTone(660, 'sine', 0.2), 100);
        }
        function playErrorSound() {
            playTone(200, 'sawtooth', 0.3);
        }

        // --- UI HELPERS ---
        const container = document.getElementById('app-container');
        const navButtons = document.getElementById('nav-buttons');

        // Helper to format /ph/ specifically
        function highlightPH(word) {
            // Find 'ph' (case insensitive) and wrap it in highlight styles
            return word.replace(/(ph)/i, (match, p1) => 
                `<span class="text-pink-600 font-black underline decoration-4 decoration-yellow-400">${p1}</span>`
            );
        }

        // Reusable Banner for every screen as requested
        function getFocusBanner() {
            return `
                <div class="flex justify-center mb-8">
                    <div class="bg-yellow-300 text-purple-900 px-6 py-3 rounded-full font-bold text-2xl border-4 border-yellow-500 shadow-[0_4px_0_rgb(202,138,4)] flex items-center gap-4">
                        <span>Focus Sounds:</span>
                        <span class="bg-white px-3 py-1 rounded-xl text-pink-600 border-2 border-pink-200">/ph/</span>
                        <span class="bg-white px-3 py-1 rounded-xl text-blue-600 border-2 border-blue-200">/ፍ/</span>
                    </div>
                </div>
            `;
        }

        // SVG Icons
        const icons = {
            audio: `<svg class="w-8 h-8" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.983 5.983 0 0115 10a5.984 5.984 0 01-1.757 4.243 1 1 0 01-1.415-1.415A3.984 3.984 0 0013 10a3.983 3.983 0 00-1.172-2.828 1 1 0 010-1.415z" clip-rule="evenodd"></path></svg>`
        };

        function showCelebration() {
            const overlay = document.getElementById('celebration-overlay');
            const badge = document.getElementById('celebration-badge');
            overlay.classList.remove('opacity-0');
            badge.classList.remove('scale-50');
            badge.classList.add('scale-100');
            playSuccessSound();
            
            setTimeout(() => {
                overlay.classList.add('opacity-0');
                badge.classList.remove('scale-100');
                badge.classList.add('scale-50');
            }, 1500);
        }

        // Randomize array
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // --- GAME MODES ---

        // 1. Interactive Flashcards
        function renderFlashcards() {
            let html = getFocusBanner() + `<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">`;
            
            words.forEach((word, index) => {
                html += `
                <div class="bg-white rounded-3xl p-4 shadow-xl border-b-8 border-pink-200 card-hover animate-bounce-in" style="animation-delay: ${index * 0.05}s">
                    <div class="relative rounded-2xl overflow-hidden mb-4 border-4 border-purple-100">
                        <!-- Image Placeholder built to accept URLs -->
                        <img src="${word.img}" alt="${word.eng}" class="w-full h-40 object-cover bg-gray-100" />
                        <button onclick="speak('${word.eng}')" class="absolute bottom-2 right-2 bg-pink-500 hover:bg-pink-400 text-white p-3 rounded-full shadow-lg transform transition active:scale-90">
                            ${icons.audio}
                        </button>
                    </div>
                    <div class="text-center">
                        <h2 class="text-3xl font-black mb-2">${highlightPH(word.eng)}</h2>
                        <div class="bg-blue-50 rounded-xl p-2 mb-2 border-2 border-blue-100">
                            <p class="text-xl font-bold text-blue-800 flex items-center justify-center gap-2">
                                <span class="bg-yellow-200 text-yellow-800 text-xs px-2 py-1 rounded-lg">Amharic</span>
                                ${word.amh}
                            </p>
                            <p class="text-sm text-gray-500 font-bold italic">(${word.pron})</p>
                        </div>
                    </div>
                </div>`;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        // 2. Listen & Match the Image
        let lmCurrentWord = null;
        function initListenMatch() {
            let options = shuffle([...words]).slice(0, 4);
            lmCurrentWord = options[Math.floor(Math.random() * options.length)];
            
            let html = getFocusBanner() + `
            <div class="max-w-4xl mx-auto bg-white rounded-3xl shadow-xl p-8 border-b-8 border-purple-200 text-center animate-bounce-in">
                <h2 class="text-3xl font-black text-purple-700 mb-6">Listen and choose the correct picture!</h2>
                
                <button onclick="speak('${lmCurrentWord.eng}')" class="bg-gradient-to-r from-pink-500 to-purple-500 hover:from-pink-400 hover:to-purple-400 text-white font-black text-2xl py-6 px-12 rounded-full shadow-[0_6px_0_rgb(168,85,247)] active:shadow-none active:translate-y-2 mb-10 transition-all flex items-center justify-center gap-4 mx-auto pulse-soft" style="animation: pulse-soft 2s infinite;">
                    ${icons.audio} Hear the Word
                </button>

                <div class="grid grid-cols-2 gap-6" id="lm-options">
                    ${options.map((opt, i) => `
                        <div onclick="checkListenMatch('${opt.eng}', this)" class="cursor-pointer bg-gray-50 rounded-3xl p-4 border-4 border-gray-200 hover:border-pink-400 transition-all transform hover:scale-105 active:scale-95 group">
                            <img src="${opt.img}" alt="Option" class="w-full h-48 object-cover rounded-2xl mb-2 group-hover:opacity-90">
                        </div>
                    `).join('')}
                </div>
                
                <button id="lm-next" onclick="initListenMatch()" class="hidden mt-8 bg-green-500 hover:bg-green-400 text-white font-black text-xl py-3 px-8 rounded-full shadow-[0_4px_0_rgb(22,163,74)] active:shadow-none active:translate-y-1 mx-auto transition-all">
                    Next Word ➔
                </button>
            </div>`;
            container.innerHTML = html;
            // Auto play on load
            setTimeout(() => speak(lmCurrentWord.eng), 500);
        }

        window.checkListenMatch = function(selectedEng, el) {
            if (selectedEng === lmCurrentWord.eng) {
                el.classList.replace('border-gray-200', 'border-green-500');
                el.classList.add('bg-green-100');
                showCelebration();
                document.getElementById('lm-next').classList.remove('hidden');
                // Lock other options
                Array.from(document.getElementById('lm-options').children).forEach(child => child.onclick = null);
            } else {
                el.classList.replace('border-gray-200', 'border-red-500');
                el.classList.add('shake-animation');
                playErrorSound();
                setTimeout(() => {
                    el.classList.remove('shake-animation');
                    el.classList.replace('border-red-500', 'border-gray-200');
                }, 500);
            }
        };

        // 3. Click the Correct Phoneme (Word Recognition)
        let wrCurrentWord = null;
        function initWordRec() {
            let options = shuffle([...words]).slice(0, 3);
            wrCurrentWord = options[Math.floor(Math.random() * options.length)];
            
            let html = getFocusBanner() + `
            <div class="max-w-4xl mx-auto bg-white rounded-3xl shadow-xl p-8 border-b-8 border-cyan-200 text-center animate-bounce-in">
                <h2 class="text-3xl font-black text-cyan-700 mb-6">Find the word for this image!</h2>
                
                <div class="relative inline-block mb-8">
                    <img src="${wrCurrentWord.img}" alt="Target" class="w-64 h-48 object-cover rounded-2xl shadow-md border-4 border-cyan-100">
                    <div class="absolute -bottom-4 -right-4 bg-yellow-300 text-yellow-900 font-bold px-4 py-2 rounded-xl shadow-lg border-2 border-yellow-400">
                        ${wrCurrentWord.amh}
                    </div>
                </div>

                <div class="flex flex-col md:flex-row justify-center gap-6" id="wr-options">
                    ${options.map(opt => `
                        <button onclick="checkWordRec('${opt.eng}', this)" class="bg-gray-100 hover:bg-cyan-50 border-4 border-gray-200 hover:border-cyan-400 text-3xl font-black text-gray-800 py-6 px-10 rounded-2xl transition-all transform hover:-translate-y-1 active:translate-y-1 flex-1 flex items-center justify-center gap-3">
                            ${highlightPH(opt.eng)}
                            <span class="inline-block bg-white p-2 rounded-full shadow text-pink-500 hover:text-pink-600 ml-2" onclick="event.stopPropagation(); speak('${opt.eng}')">
                                ${icons.audio}
                            </span>
                        </button>
                    `).join('')}
                </div>
                
                <button id="wr-next" onclick="initWordRec()" class="hidden mt-10 bg-green-500 hover:bg-green-400 text-white font-black text-xl py-3 px-8 rounded-full shadow-[0_4px_0_rgb(22,163,74)] active:shadow-none active:translate-y-1 mx-auto transition-all">
                    Next Game ➔
                </button>
            </div>`;
            container.innerHTML = html;
        }

        window.checkWordRec = function(selectedEng, el) {
            if (selectedEng === wrCurrentWord.eng) {
                el.classList.replace('border-gray-200', 'border-green-500');
                el.classList.replace('hover:border-cyan-400', 'border-green-500');
                el.classList.replace('bg-gray-100', 'bg-green-100');
                showCelebration();
                document.getElementById('wr-next').classList.remove('hidden');
                // Lock other options
                Array.from(document.getElementById('wr-options').children).forEach(child => child.onclick = null);
            } else {
                el.classList.replace('border-gray-200', 'border-red-500');
                el.classList.add('shake-animation');
                playErrorSound();
                setTimeout(() => {
                    el.classList.remove('shake-animation');
                    el.classList.replace('border-red-500', 'border-gray-200');
                }, 500);
            }
        };

        // 4. Amharic vs English Matching
        let selectedEngNode = null;
        let selectedAmhNode = null;
        let matchesFound = 0;
        let currentMatchSetSize = 5; // Show 5 at a time so it's not overwhelming

        function initAmharicMatch() {
            matchesFound = 0;
            selectedEngNode = null;
            selectedAmhNode = null;
            
            let subset = shuffle([...words]).slice(0, currentMatchSetSize);
            let engList = shuffle([...subset]);
            let amhList = shuffle([...subset]);

            let html = getFocusBanner() + `
            <div class="max-w-5xl mx-auto bg-white rounded-3xl shadow-xl p-8 border-b-8 border-yellow-200 text-center animate-bounce-in">
                <h2 class="text-3xl font-black text-yellow-700 mb-2">Connect the Pairs!</h2>
                <p class="text-gray-500 font-bold mb-8">Tap an English word, then tap its Amharic meaning.</p>
                
                <div class="flex flex-col md:flex-row gap-8 justify-center">
                    
                    <!-- English Column -->
                    <div class="flex-1 flex flex-col gap-4">
                        <h3 class="font-black text-xl text-pink-600 bg-pink-100 rounded-xl py-2 mb-2 border-2 border-pink-200">English (/ph/)</h3>
                        ${engList.map(w => `
                            <button id="eng-${w.eng}" onclick="selectMatchWord('eng', '${w.eng}', '${w.amh}', this)" class="match-btn match-eng bg-white border-4 border-gray-200 hover:border-pink-300 text-2xl font-black py-4 px-6 rounded-2xl shadow-sm transition-all text-left flex justify-between items-center group">
                                <span>${highlightPH(w.eng)}</span>
                                <span class="bg-gray-100 p-2 rounded-full text-gray-400 group-hover:text-pink-500 group-hover:bg-pink-50 transition-colors" onclick="event.stopPropagation(); speak('${w.eng}')">
                                    ${icons.audio}
                                </span>
                            </button>
                        `).join('')}
                    </div>

                    <!-- Amharic Column -->
                    <div class="flex-1 flex flex-col gap-4">
                        <h3 class="font-black text-xl text-blue-600 bg-blue-100 rounded-xl py-2 mb-2 border-2 border-blue-200">Amharic (/ፍ/)</h3>
                        ${amhList.map(w => `
                            <button id="amh-${w.eng}" onclick="selectMatchWord('amh', '${w.eng}', '${w.amh}', this)" class="match-btn match-amh bg-white border-4 border-gray-200 hover:border-blue-300 text-2xl font-bold py-4 px-6 rounded-2xl shadow-sm transition-all text-center flex flex-col items-center gap-1">
                                <span class="text-blue-800">${w.amh}</span>
                                <span class="text-sm text-gray-400 italic font-bold">(${w.pron})</span>
                            </button>
                        `).join('')}
                    </div>

                </div>

                <button id="am-next" onclick="initAmharicMatch()" class="hidden mt-10 bg-green-500 hover:bg-green-400 text-white font-black text-xl py-3 px-8 rounded-full shadow-[0_4px_0_rgb(22,163,74)] active:shadow-none active:translate-y-1 mx-auto transition-all">
                    Play Again ➔
                </button>
            </div>`;
            container.innerHTML = html;
        }

        window.selectMatchWord = function(type, idString, amhString, el) {
            // Ignore if already matched
            if(el.classList.contains('matched')) return;

            // Handle English selection
            if (type === 'eng') {
                if (selectedEngNode) {
                    selectedEngNode.classList.replace('border-pink-500', 'border-gray-200');
                    selectedEngNode.classList.remove('bg-pink-50');
                }
                selectedEngNode = el;
                selectedEngNode.dataset.matchId = idString;
                selectedEngNode.classList.replace('border-gray-200', 'border-pink-500');
                selectedEngNode.classList.add('bg-pink-50');
                speak(idString); // Read the word aloud when selected
            } 
            // Handle Amharic selection
            else {
                if (selectedAmhNode) {
                    selectedAmhNode.classList.replace('border-blue-500', 'border-gray-200');
                    selectedAmhNode.classList.remove('bg-blue-50');
                }
                selectedAmhNode = el;
                selectedAmhNode.dataset.matchId = idString;
                selectedAmhNode.classList.replace('border-gray-200', 'border-blue-500');
                selectedAmhNode.classList.add('bg-blue-50');
            }

            // Check match if both selected
            if (selectedEngNode && selectedAmhNode) {
                checkAmharicMatch();
            }
        };

        function checkAmharicMatch() {
            const engId = selectedEngNode.dataset.matchId;
            const amhId = selectedAmhNode.dataset.matchId;

            if (engId === amhId) {
                // Correct match
                selectedEngNode.classList.replace('border-pink-500', 'border-green-500');
                selectedEngNode.classList.replace('bg-pink-50', 'bg-green-100');
                selectedEngNode.classList.add('matched', 'opacity-75', 'scale-95');
                
                selectedAmhNode.classList.replace('border-blue-500', 'border-green-500');
                selectedAmhNode.classList.replace('bg-blue-50', 'bg-green-100');
                selectedAmhNode.classList.add('matched', 'opacity-75', 'scale-95');

                playSuccessSound();
                
                // Clear selection
                selectedEngNode = null;
                selectedAmhNode = null;
                matchesFound++;

                if(matchesFound === currentMatchSetSize) {
                    setTimeout(() => {
                        showCelebration();
                        document.getElementById('am-next').classList.remove('hidden');
                    }, 500);
                }

            } else {
                // Incorrect match
                let eNode = selectedEngNode;
                let aNode = selectedAmhNode;
                
                eNode.classList.replace('border-pink-500', 'border-red-500');
                aNode.classList.replace('border-blue-500', 'border-red-500');
                eNode.classList.add('shake-animation');
                aNode.classList.add('shake-animation');
                playErrorSound();

                setTimeout(() => {
                    eNode.classList.remove('shake-animation');
                    aNode.classList.remove('shake-animation');
                    eNode.classList.replace('border-red-500', 'border-gray-200');
                    aNode.classList.replace('border-red-500', 'border-gray-200');
                    eNode.classList.remove('bg-pink-50');
                    aNode.classList.remove('bg-blue-50');
                }, 600);

                selectedEngNode = null;
                selectedAmhNode = null;
            }
        }

        // --- NAVIGATION & INITIALIZATION ---
        const modes = [
            { id: 'flashcards', label: 'Flashcards', color: 'pink', action: renderFlashcards },
            { id: 'listen', label: 'Listen & Match', color: 'purple', action: initListenMatch },
            { id: 'word', label: 'Find the Word', color: 'cyan', action: initWordRec },
            { id: 'match', label: 'Match Pairs', color: 'yellow', action: initAmharicMatch }
        ];

        function renderNav() {
            let html = '';
            modes.forEach(mode => {
                html += `
                <button onclick="setMode('${mode.id}')" id="nav-${mode.id}" class="nav-btn bg-white border-2 border-gray-200 text-gray-600 font-bold py-2 px-4 rounded-xl hover:bg-gray-50 transition-all shadow-sm">
                    ${mode.label}
                </button>`;
            });
            navButtons.innerHTML = html;
        }

        function setMode(id) {
            // Update active state in nav
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.className = "nav-btn bg-white border-2 border-gray-200 text-gray-500 font-bold py-2 px-4 rounded-xl hover:bg-gray-50 transition-all shadow-sm transform hover:scale-105 active:scale-95";
            });
            
            const activeBtn = document.getElementById(`nav-${id}`);
            const mode = modes.find(m => m.id === id);
            
            // Apply specific active color classes based on mode
            const colorClasses = {
                'pink': 'bg-pink-500 border-pink-600 text-white shadow-[0_4px_0_rgb(219,39,119)]',
                'purple': 'bg-purple-500 border-purple-600 text-white shadow-[0_4px_0_rgb(147,51,234)]',
                'cyan': 'bg-cyan-500 border-cyan-600 text-white shadow-[0_4px_0_rgb(8,145,178)]',
                'yellow': 'bg-yellow-400 border-yellow-500 text-yellow-900 shadow-[0_4px_0_rgb(202,138,4)]'
            };

            activeBtn.className = `nav-btn font-black py-2 px-4 rounded-xl transition-all transform hover:scale-105 active:translate-y-1 active:shadow-none ${colorClasses[mode.color]}`;

            // Render game mode
            mode.action();
        }

        // Initialize App
        renderNav();
        setMode('flashcards'); // Default landing page

    </script>
</body>
</html>
